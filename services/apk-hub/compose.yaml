services:
  apkhub:
    build: .
    image: apk-hub:browser-guide-20260919
    restart: unless-stopped
    init: true
    env_file: service.env
    environment:
      PUBLIC_BASE_URL: https://212.189.31.46
      DATA_DIR: /data
      LISTEN_HOST: 0.0.0.0
    volumes:
      - ./data:/data
    networks:
      - gateway
    read_only: true
    tmpfs:
      - /tmp:size=1073741824,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  gateway:
    external: true
    name: jinling-mahjong_default
