<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>八条与花牌 · 字面校对</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0a3e35;color:#f4e8bf;font:18px system-ui;padding:28px}h1{font-size:26px;margin:0 0 12px}p{color:#b8d5c6;margin:0 0 25px}.row{display:flex;gap:18px;align-items:flex-start}.tile{background:linear-gradient(#fffefa,#f3f0e5);border:1px solid #d0cbbc;border-radius:9px;box-shadow:0 5px 0 #376429,0 8px 10px #07272070;width:111px;height:157px;display:flex;align-items:center;justify-content:center}.tile img{width:102px;height:143px;object-fit:contain}.large{width:180px;height:252px}.large img{width:160px;height:225px}figure{margin:0;text-align:center}figcaption{margin-top:15px;font-weight:600}.flowers{display:grid;grid-template-columns:repeat(4,111px);gap:25px 17px}.eight{margin-right:40px}.note{font-size:15px;color:#afc9bb;margin-top:25px}</style>
<h1>八条与花牌 · 字面校对</h1><p>八条：上 W、下 M，竹节分开。花牌：春夏秋冬、梅兰竹菊。</p>
<div class="row"><figure class="eight"><div class="tile large"><img src="ink/25.png"></div><figcaption>八条</figcaption></figure><div class="flowers" id="flowers"></div></div>
<div class="note">象牙白底衬预览 · 正式牌桌使用统一光照烘焙的多角度牌图</div>
<script>document.querySelector('#flowers').innerHTML=['春','夏','秋','冬','梅','兰','竹','菊'].map((n,i)=>`<figure><div class="tile"><img src="ink/${34+i}.png"></div><figcaption>${n}</figcaption></figure>`).join('')</script></html>
